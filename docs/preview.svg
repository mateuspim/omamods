<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1015"/><stop offset=".58" stop-color="#0a111b"/><stop offset="1" stop-color="#102236"/>
  </linearGradient>
  <radialGradient id="greenGlow" cx="0" cy="1" r="1">
    <stop offset="0" stop-color="#16a46b" stop-opacity=".27"/><stop offset=".64" stop-color="#16a46b" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="blueGlow" cx="1" cy="0" r="1">
    <stop offset="0" stop-color="#264d78" stop-opacity=".27"/><stop offset=".7" stop-color="#264d78" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="56" height="56" patternUnits="userSpaceOnUse">
