  </pattern>
  <linearGradient id="line" x1="0" x2="1"><stop stop-color="#38da89"/><stop offset="1" stop-color="#38da89" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-.2" y="-.2" width="1.5" height="1.6"><feGaussianBlur stdDeviation="45"/></filter>
  <filter id="glow" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="3840" height="2160" fill="url(#background)"/>
