[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omamods"
version = "0.1.1"
description = "Terminal mod manager for Linux game libraries, with safe install and revert"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["PyYAML>=6.0,<7", "textual>=8,<9", "textual-image>=0.14,<0.15"]

[project.optional-dependencies]
dev = ["black>=24", "pyflakes>=3"]

[project.scripts]
omamods = "omamods.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
target-version = ["py312"]
